apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: debian13
  namespace: default
  labels:
    app: debian13
spec:
  runStrategy: Always
  dataVolumeTemplates:
    # Root disk: import dell'immagine qcow2 Debian 13 (genericcloud, supporta cloud-init)
    - metadata:
        name: debian13-root
      spec:
        source:
          http:
            url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
        storage:
          resources:
            requests:
              storage: 10Gi
    # Disco dati secondario: vuoto
    - metadata:
        name: debian13-data
      spec:
        source:
          blank: {}
        storage:
          resources:
            requests:
              storage: 5Gi
  template:
    metadata:
      labels:
        app: debian13
    spec:
      architecture: amd64
      domain:
        machine:
          type: q35
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: datadisk
              serial: datadisk        # appare come /dev/disk/by-id/virtio-datadisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
          rng: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 60
      volumes:
        - name: rootdisk
          dataVolume:
            name: debian13-root
        - name: datadisk
          dataVolume:
            name: debian13-data
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              timezone: Europe/Rome
              locale: it_IT.UTF-8
              user: debian
              password: debian
              chpasswd:
                expire: false
              ssh_pwauth: true
              package_update: true
              package_upgrade: false
              packages:
                - qemu-guest-agent
                - curl
                - vim
                - nano
                - htop
                - net-tools
              fs_setup:
                - label: data
                  filesystem: ext4
                  device: /dev/disk/by-id/virtio-datadisk
                  partition: none
                  overwrite: false
              runcmd:
                - systemctl enable --now qemu-guest-agent
              mounts:
                - [ "LABEL=data", /data, ext4, "defaults,nofail", "0", "2" ]